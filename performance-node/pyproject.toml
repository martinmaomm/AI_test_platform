[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "performance-node"
version = "0.1.0"
description = "Independent performance node enrollment and heartbeat client"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests==2.32.5",
    "psutil==7.2.2",
]

[project.optional-dependencies]
# Reserved for the next delivery. This package deliberately does not import it yet.
engine = ["locust==2.43.3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
